services:
  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
    ports:
      - ${TRAEFIK_PORT}:80
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - demo_network

  tinyauth:
    image: ghcr.io/tinyauthapp/tinyauth:v5
    restart: unless-stopped
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      traefik.enable: true
      traefik.http.routers.tinyauth.rule: Host(`${TRAEFIK_TINYAUTH_DOMAIN}`)
      traefik.http.routers.tinyauth.entrypoints: web
      traefik.http.services.tinyauth.loadbalancer.server.port: 3000
      traefik.http.middlewares.tinyauth.forwardauth.address: http://tinyauth:3000/api/auth/traefik
      traefik.http.middlewares.tinyauth.forwardauth.authResponseHeaders: Remote-User,Remote-Name,Remote-Email,Remote-Groups,Remote-Sub
    networks:
      - demo_network

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/tinyauthapp/demo:v0
    restart: unless-stopped
    env_file: .env
    labels:
      traefik.enable: true
      traefik.http.routers.demo.rule: Host(`${TRAEFIK_DEMO_DOMAIN}`)
      traefik.http.routers.demo.entrypoints: web
      traefik.http.services.demo.loadbalancer.server.port: 3000
      traefik.http.routers.demo.middlewares: tinyauth
      tinyauth.apps.demo.path.allow: ^(\/|\/bg.webp)$
      tinyauth.apps.demo.config.domain: ${TRAEFIK_DEMO_DOMAIN}
    networks:
      - demo_network

networks:
  demo_network:
    ipam:
      config:
        - subnet: 172.30.0.0/24
